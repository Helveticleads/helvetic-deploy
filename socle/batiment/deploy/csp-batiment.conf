# SOCLE BATIMENT : la politique de securite du contenu, commune aux 27 sites.
#
# Decision de Frederic du 01.11 : une MEME politique sur les 27 sites, en
# RAPPORT SEUL (Report-Only), qui autorise les deux origines du widget de chat.
#
# Etat releve le 01.11, avant ce chantier :
#   - 18 sites Replit servaient deja un Report-Only, mais SANS les deux
#     origines du widget : `script-src 'self'` et `connect-src 'self'` ;
#   - les 9 sites Claude Code ne servaient AUCUN en-tete de politique.
#
# Rapport seul veut dire : rien n'est bloque, les violations sont seulement
# signalees. Le widget fonctionnerait donc meme sans ces deux origines. Elles
# sont posees maintenant pour deux raisons : ne pas signaler une violation a
# chaque visite, et ne pas casser le widget le jour ou la politique passera en
# applique.
#
# CE FICHIER N'EST PAS DEPLOYE PAR CE CHANTIER. Il est la reference que porte
# chaque site, sous `deploy/csp-batiment.conf`, et que la garde de conformite
# compare. Sa pose sur nginx est un geste d'exploitation, a faire lot par lot,
# avec `nginx -t` puis un rechargement.
#
# Pose : dans le bloc `server` du vhost du site.

add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self' https://widget.premiumhelveticleads.ch; connect-src 'self' https://comms.premiumhelveticleads.ch; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
