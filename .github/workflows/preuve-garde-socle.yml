name: Preuves du socle batiment

# Le gabarit du socle n'a pas de paquet a lui : ces preuves le montent a part.
# Contre-epreuve sur le dernier tag : git doit voir les tags et l'historique.
on:
  pull_request:
    paths:
      - socle/batiment/**
      - ops/garde-socle/**
      - .github/workflows/preuve-garde-socle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preuves-socle:
    name: preuves-socle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Le manifeste correspond aux fichiers du socle
        run: |
          node ops/garde-socle/manifeste.mjs
          git diff --exit-code -- socle/batiment/MANIFESTE.json
      - name: Double clic du formulaire d'accueil
        run: node ops/garde-socle/preuve-double-clic.mjs v1.3.0
      - name: Un formulaire qui n'envoie rien
        run: node ops/garde-socle/preuve-formulaire-envoi.mjs v1.3.0
      - name: Le menu ouvert retire le chat, la place du bouton est reservee
        run: node ops/garde-socle/preuve-widget.mjs v1.4.0
      - name: Drapeau ligne, libelle du bouton, horaire etiquete, six emplacements, greffe par nom
        run: node ops/garde-socle/preuve-v1-6-0.mjs v1.5.0
      - name: Regle du telephone du batiment, barre du bas et garde des pages
        run: node ops/garde-socle/preuve-v1-6-1.mjs v1.6.0
      - name: Garde v1.6.2, Telefon, rufen Sie an, une seule plage horaire, exception ueber das Formular
        run: node ops/garde-socle/preuve-v1-6-2.mjs v1.6.1
      - name: Case de consentement neutre, lien de confidentialite
        run: node ops/garde-socle/preuve-v1-6-3.mjs v1.6.2
