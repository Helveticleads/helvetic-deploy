# Analytics servi sous le domaine du site, au lieu d'un appel direct au
# domaine central — qui reliait publiquement tous les sites entre eux.
#
# `^~` est OBLIGATOIRE : sans lui, une location regex du type
# `\.(css|js|...)$` prend la priorité en nginx et /_a/script.js est cherché
# sur le disque → 404, analytics muet.
#
# Le proxy couvre TOUT /_a/, pas seulement le script : Umami déduit son point
# de collecte de l'URL du script (`dirname(src)/api/send`). Proxifier le seul
# script laisserait la balise appeler le domaine central en clair.
#
# Résolution DNS différée (variable + resolver) : nginx ne résout plus au
# démarrage — un analytics injoignable au boot n'empêche plus nginx -t / start.
location ^~ /_a/ {
    resolver 127.0.0.53 valid=30s ipv6=off;
    set $umami_host analytics.premiumhelveticleads.ch;
    rewrite ^/_a/(.*)$ /$1 break;
    proxy_pass https://$umami_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $umami_host;
    proxy_set_header Host $umami_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

