server {
    server_name helvetic-rohrreinigung.ch www.helvetic-rohrreinigung.ch;

    root /var/www/helvetic-rohrreinigung.ch/current;
    index index.html;
    rewrite ^/de/?(.*)$ /$1 permanent;

    include /etc/nginx/snippets/umami-proxy.conf;
    include /etc/nginx/snippets/helvetic-rohrreinigung.ch-g1-301.conf;
    include /etc/nginx/snippets/helvetic-rohrreinigung.ch-legacy-intention-301.conf;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Doublons umlaut → canonique (slug préservé, avant les préfixes)
    # Seedorf : trois communes portent ce nom (UR, BE, SO). L'URL ne dit pas
    # laquelle. On renvoie vers l'index, qui est exact, plutôt que vers une
    # commune choisie au hasard, qui ne le serait pas. 44 impressions.
    location = /staedte/seedorf  { return 301 /staedte/; }
    location = /staedte/seedorf/ { return 301 /staedte/; }
    # 3 redirections de ville retirees le 20/10 : remplacees par g1-301 (deux formes, cible avec barre).

    # Préfixes DE legacy (slug préservé)
    location ~ ^/rohrreinigung/(.*)$  { return 301 /staedte/$1$is_args$args; }
    location ~ ^/einsatzgebiete/(.*)$ { return 301 /staedte/$1$is_args$args; }
    location = /einsatzgebiete       { return 301 /staedte; }
    location = /einsatzgebiet        { return 301 /staedte; }

    # Préfixes FR dynamiques (slug PRÉSERVÉ — mieux que le fallback SSR)
    location ~ ^/villes/(.*)$    { return 301 /staedte/$1$is_args$args; }
    location ~ ^/problemes/(.*)$ { return 301 /probleme/$1$is_args$args; }
    # /services/ : mapping spécifique (slugs FR ≠ DE) → hub leistungen (pas de map 1:1 fiable)
    location ~ ^/services/(.*)$  { return 301 /leistungen$is_args$args; }
    location ~ ^/intervention/(.*)$ { return 301 /anliegen$is_args$args; }

    # Statiques FR → DE (exact)
    location = /contact                   { return 301 /kontakt; }
    location = /tarifs                    { return 301 /preise; }
    location = /zones                     { return 301 /staedte; }
    location = /mentions-legales          { return 301 /impressum; }
    location = /politique-confidentialite { return 301 /datenschutz; }
    location = /conditions-utilisation    { return 301 /agb; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/helvetic-rohrreinigung.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/helvetic-rohrreinigung.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = www.helvetic-rohrreinigung.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = helvetic-rohrreinigung.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name helvetic-rohrreinigung.ch www.helvetic-rohrreinigung.ch;
    return 404; # managed by Certbot




}
