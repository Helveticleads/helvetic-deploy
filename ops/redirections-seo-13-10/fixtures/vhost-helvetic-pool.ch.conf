server {
    server_name helvetic-pool.ch www.helvetic-pool.ch;
    root /var/www/helvetic-pool.ch/current;
    index index.html;
    include /etc/nginx/snippets/block-sourcemaps.conf;

    include /etc/nginx/snippets/umami-proxy.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirects SEO 301 (slugs migres)
    location = /pool-notfall-schweiz  { return 301 /pool-pannendienst-schweiz; }
    location = /pool-notfall-schweiz/ { return 301 /pool-pannendienst-schweiz; }
    location = /kantone               { return 301 /kanton; }
    location = /kantone/              { return 301 /kanton; }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/helvetic-pool.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/helvetic-pool.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.helvetic-pool.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = helvetic-pool.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name helvetic-pool.ch www.helvetic-pool.ch;
    return 404; # managed by Certbot




}